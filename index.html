  <script>
    (function () {
      var button = document.getElementById('theme-toggle');
      var bgInput = document.getElementById('bg-color');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
      function currentTheme() {
        var attr = document.documentElement.getAttribute('data-theme');
        return attr || (prefersDark.matches ? 'dark' : 'light');
      }
      function updateLabel() {
        var isDark = currentTheme() === 'dark';
        button.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      function setTheme(next) {
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateLabel();
      }
      // Perceived brightness (YIQ), so light-on-light / dark-on-dark text
      // never happens no matter which background color gets picked.
      function isLight(hex) {
        var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return (r * 299 + g * 587 + b * 114) / 1000 >= 140;
      }
      button.addEventListener('click', function () {
        setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
      });
      updateLabel();

      var savedBg = localStorage.getItem('bgColor');
      if (savedBg) {
        bgInput.value = savedBg;
      } else {
        var current = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
        if (/^#[0-9a-f]{6}$/i.test(current)) bgInput.value = current;
      }
      bgInput.addEventListener('input', function () {
        document.documentElement.style.setProperty('--bg', bgInput.value);
        localStorage.setItem('bgColor', bgInput.value);
        setTheme(isLight(bgInput.value) ? 'light' : 'dark');
      });
    })();
  </script>
  <script type="module" src="./main.js"></script>
